<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <div>
        <p class="eyebrow">Number logic</p>
        <h1>Sudoku</h1>
      </div>
      <div class="game-details">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
        <label class="difficulty-control" for="difficulty">
          <span>New game level</span>
          <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </label>
        <div class="game-stat">
          <span class="stat-label">Current game</span>
          <span id="current-difficulty" class="stat-value">Medium</span>
        </div>
        <div class="game-stat timer-stat">
          <span class="stat-label">Time</span>
          <output id="game-timer" class="stat-value" aria-label="Elapsed time" aria-live="off">00:00</output>
        </div>
      </div>
    </header>
    <section class="board-section" aria-label="Sudoku puzzle">
      <div id="sudoku-board"></div>
    </section>
    <div class="controls">
      <button id="new-game" type="button">New Game</button>
      <button id="get-hint" type="button">Hint</button>
      <button id="check-solution" type="button">Check Solution</button>
    </div>
    <p id="message" role="status" aria-live="polite"></p>
    <form id="score-form" class="score-form" hidden>
      <label for="player-name">Add your name to the leaderboard</label>
      <div class="score-entry">
        <input id="player-name" name="player-name" type="text" maxlength="24" autocomplete="name" required>
        <button type="submit">Save Time</button>
      </div>
    </form>
    <section class="leaderboard" aria-labelledby="leaderboard-title">
      <div class="leaderboard-heading">
        <h2 id="leaderboard-title">Top 10 Fastest</h2>
        <span>All difficulties</span>
      </div>
      <div class="leaderboard-scroll">
        <table>
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">Player</th>
              <th scope="col">Time</th>
              <th scope="col">Level</th>
              <th scope="col">Hints</th>
            </tr>
          </thead>
          <tbody id="leaderboard-entries"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/static/main.js"></script>
</body>
</html>
